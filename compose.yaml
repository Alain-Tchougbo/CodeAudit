services:
  mailpit:
    image: axllent/mailpit:v1.33.0
    profiles: [mail]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8026}:8025"
    environment:
      MP_MAX_MESSAGES: 200
      MP_SMTP_DISABLE_RDNS: 'true'
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeaudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeaudit}
      POSTGRES_DB: ${POSTGRES_DB:-codeaudit}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
